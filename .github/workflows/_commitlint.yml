name: Commitlint

on:
  workflow_call:
    inputs:
      from-sha:
        description: Exclusive lower bound SHA (PR base). Defaults to HEAD~1.
        type: string
        required: false
      to-sha:
        description: Inclusive upper bound SHA (PR head). Defaults to HEAD.
        type: string
        required: false

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install commitlint
        run: npm install --no-save @commitlint/cli @commitlint/config-conventional

      - name: Lint commits
        env:
          FROM: ${{ inputs.from-sha || 'HEAD~1' }}
          TO: ${{ inputs.to-sha || 'HEAD' }}
        run: npx commitlint --from "$FROM" --to "$TO" --verbose
