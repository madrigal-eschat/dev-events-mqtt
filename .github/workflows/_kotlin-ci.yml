name: Kotlin CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Path to the Gradle project root, relative to the repo root.
        type: string
        required: false
        default: '.'

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Verify plugin
        run: ./gradlew verifyPlugin --no-daemon

      - name: Install ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/latest/download/ktlint
          chmod +x ktlint
          sudo mv ktlint /usr/local/bin/

      - name: Lint
        run: find src -name "*.kt" -print0 | xargs -0 ktlint
