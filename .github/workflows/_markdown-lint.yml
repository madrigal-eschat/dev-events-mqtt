name: Markdown lint

on:
  workflow_call:

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install markdownlint-cli2
        run: npm install --no-save markdownlint-cli2

      - name: Lint markdown
        run: npx markdownlint-cli2 README.md MESSAGE-FORMAT.md
