name: Kotlin Coverage

# Requires org.jetbrains.kotlinx.kover applied in build.gradle.kts:
#   plugins { id("org.jetbrains.kotlinx.kover") version "0.9.1" }
# The koverXmlReport task produces build/reports/kover/report.xml.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Path to the Gradle project root, relative to repo root.
        type: string
        required: false
        default: '.'
      base-ref:
        description: Base branch name to diff against (e.g. main).
        type: string
        required: false
        default: main

jobs:
  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Generate coverage report
        run: ./gradlew koverXmlReport --no-daemon

      - name: Install diff-cover
        run: pip install diff-cover

      - name: Check diff coverage
        run: >
          diff-cover build/reports/kover/report.xml
          --compare-branch=origin/${{ inputs.base-ref }}
          --fail-under=100
          --diff-range-notation=...
